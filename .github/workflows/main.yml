name: Android APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle Izinlerini Ayarla
      run: chmod +x gradlew

    - name: APK'yi Insa Et (Debug)
      run: ./gradlew assembleDebug

    - name: APK'yi Sisteme Yukle
      uses: actions/upload-artifact@v4
      with:
        name: 3D-Tarayici-APK
        path: app/build/outputs/apk/debug/app-debug.apk
