name: Android APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kurulumu (Manuel ve Cachesiz)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'
        cache-disabled: true

    - name: APK'yi Insa Et
      run: |
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        echo "Proje dizini bulundu: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug

    - name: APK'yi Bul ve Yukle
      uses: actions/upload-artifact@v4
      with:
        name: 3D-Tarayici-APK
        path: '**/build/outputs/apk/debug/*.apk'
